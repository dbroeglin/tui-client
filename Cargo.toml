[package]
name = "tui-client"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
shared-models = { version = "0.1.0", path = "../shared-models" }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "time"] }
